<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" role="img" aria-label="About Chirag Tank" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="55%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#16222b"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d9ff"/>
      <stop offset="50%" stop-color="#8a5cf6"/>
      <stop offset="100%" stop-color="#00d9ff"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    text { font-family: 'Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; font-size: 15px; }
    .lbl  { fill: #00d9ff; font-weight: 600; }
    .val  { fill: #e6edf3; }
    .dim  { fill: #6e7681; }
    .acc  { fill: #a78bfa; }
    .ttl  { fill: #8b949e; font-size: 13px; }
    .tag  { fill: #8b949e; font-size: 14px; font-style: italic; }

    .frame { stroke-dasharray: 2400; stroke-dashoffset: 2400;
             animation: draw 2s ease-out forwards, pulse 3.5s ease-in-out 2s infinite; }
    .row   { opacity: 0; animation: slide .7s ease-out forwards; }
    .r1 { animation-delay: .6s; } .r2 { animation-delay: 1.0s; } .r3 { animation-delay: 1.4s; }
    .r4 { animation-delay: 1.8s; } .r5 { animation-delay: 2.2s; } .r6 { animation-delay: 2.6s; }
    .foot  { opacity: 0; animation: slide .8s ease-out 3.1s forwards; }
    .cursor { animation: blink 1s step-end infinite; }
    .dot { animation: bob 3s ease-in-out infinite; }
    .d2 { animation-delay: .3s; } .d3 { animation-delay: .6s; }

    @keyframes draw  { to { stroke-dashoffset: 0; } }
    @keyframes pulse { 0%,100% { stroke-opacity: 1; } 50% { stroke-opacity: .45; } }
    @keyframes slide { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes bob   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
  </style>

  <!-- card -->
  <rect x="2" y="2" width="816" height="356" rx="16" fill="url(#bg)"/>
  <rect class="frame" x="2" y="2" width="816" height="356" rx="16" fill="none" stroke="url(#border)" stroke-width="2" filter="url(#glow)"/>

  <!-- title bar -->
  <circle class="dot"    cx="30" cy="28" r="6" fill="#ff5f56"/>
  <circle class="dot d2" cx="52" cy="28" r="6" fill="#ffbd2e"/>
  <circle class="dot d3" cx="74" cy="28" r="6" fill="#27c93f"/>
  <text class="ttl" x="410" y="33" text-anchor="middle">chirag@portfolio:~/about</text>
  <line x1="2" y1="52" x2="818" y2="52" stroke="#30363d" stroke-width="1"/>

  <!-- rows -->
  <g class="row r1"><text x="40" y="92"  class="dim">&gt;</text><text x="62" y="92"  class="lbl">role</text><text x="190" y="92"  class="val">Full Stack Developer @ Mintergraph (Jaipur)</text></g>
  <g class="row r2"><text x="40" y="130" class="dim">&gt;</text><text x="62" y="130" class="lbl">education</text><text x="190" y="130" class="val">MCA (2026)  <tspan class="acc">·</tspan>  BCA (2024)</text></g>
  <g class="row r3"><text x="40" y="168" class="dim">&gt;</text><text x="62" y="168" class="lbl">stack</text><text x="190" y="168" class="val">React <tspan class="acc">·</tspan> Node.js <tspan class="acc">·</tspan> ASP.NET Core <tspan class="acc">·</tspan> FastAPI</text></g>
  <g class="row r4"><text x="40" y="206" class="dim">&gt;</text><text x="62" y="206" class="lbl">ai_focus</text><text x="190" y="206" class="val">Gemini <tspan class="acc">·</tspan> OpenRouter <tspan class="acc">·</tspan> RAG <tspan class="acc">·</tspan> Chroma</text></g>
  <g class="row r5"><text x="40" y="244" class="dim">&gt;</text><text x="62" y="244" class="lbl">building</text><text x="190" y="244" class="val">HR Quarterly Review &amp; Appraisal System (KRA)</text></g>
  <g class="row r6"><text x="40" y="282" class="dim">&gt;</text><text x="62" y="282" class="lbl">open_to</text><text x="190" y="282" class="val">Remote work <tspan class="acc">·</tspan> Relocation <tspan class="acc">·</tspan> Collaboration</text></g>

  <!-- footer -->
  <line x1="40" y1="306" x2="780" y2="306" stroke="#30363d" stroke-width="1"/>
  <g class="foot">
    <text x="40" y="334" class="tag">Shipping practical AI features that real users actually benefit from.</text>
    <rect class="cursor" x="628" y="321" width="9" height="16" fill="#00d9ff"/>
  </g>
</svg>
